[supervisord]
nodaemon=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1366x768x24
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chrome]
environment=DISPLAY=":99",LANG="en_US.UTF-8",LANGUAGE="en_US:en",LC_ALL="en_US.UTF-8"
command=/usr/bin/google-chrome-stable --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-blink-features=AutomationControlled --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --user-data-dir=/data/chrome-profile --window-size=1366,768 --start-maximized --lang=en-US --accept-lang=en-US about:blank
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp-bridge]
directory=/app/mcp-server
environment=DISPLAY=":99"
command=node_modules/.bin/supergateway --stdio "node_modules/.bin/chrome-devtools-mcp --browserUrl http://localhost:9222 --no-usage-statistics --no-performance-crux" --port 3002 --host 127.0.0.1
autorestart=true
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp-auth-proxy]
directory=/app/mcp-server
environment=PORT="3001",BRIDGE_TARGET="http://127.0.0.1:3002",MCP_AUTH_TOKEN="%(ENV_MCP_AUTH_TOKEN)s"
command=node server.js
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0