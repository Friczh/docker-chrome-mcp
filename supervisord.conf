[supervisord]
nodaemon=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1366x768x24
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chrome]
environment=DISPLAY=":99",LANG="en_US.UTF-8",LANGUAGE="en_US:en",LC_ALL="en_US.UTF-8"
command=/usr/bin/google-chrome-stable --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-blink-features=AutomationControlled --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --user-data-dir=/data/chrome-profile --window-size=1366,768 --start-maximized --lang=en-US --accept-lang=en-US about:blank
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp-server]
directory=/app/mcp-server
environment=DISPLAY=":99",PORT="3001",CDP_URL="http://localhost:9222",OUTPUT_DIR="/data/outputs",SNAPSHOTS_DIR="/data/snapshots",PUBLIC_BASE="https://sf-server.tail283dda.ts.net",MCP_AUTH_TOKEN="%(ENV_MCP_AUTH_TOKEN)s",FILES_TOKEN="%(ENV_FILES_TOKEN)s"
command=node server.js
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
